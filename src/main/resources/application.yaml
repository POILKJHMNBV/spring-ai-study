spring:
  application:
    name: spring-ai-study
  profiles:
    active: mcp
  ai:
    ollama:
      chat:
        model: qwen3.5:9b
        # Day10 四个工具的 Schema、RAG 与多轮证据需要更大的上下文，避免本机默认 4096 截断。
        num-ctx: 8192
      embedding:
        # 中文知识库使用 BGE-M3；更换模型后由启动流程全量重建内存索引。
        model: bge-m3
        # 禁止静默截断，超长文档必须定位到小节后重新切分。
        truncate: false

rag:
  retrieval:
    top-k: 3
    # 调试全量排序时显式传 threshold=0；默认值由开发集校准。
    threshold: 0.47

logging:
  level:
    org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor: info

app:
  ops:
    # 正常运行 Day8 时走 HTTP。
    # 固定回归测试会覆盖成 MOCK。
    data-source: HTTP

    # 独立 service-observer 测试服务。
    base-url: http://127.0.0.1:18081
